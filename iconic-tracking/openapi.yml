openapi: 3.0.3
info:
  title: API Tracking ICONIC
  description: |
    Integração das transportadoras com o tracking de entregas da ICONIC.

    São contempladas duas integrações: **geolocalização** (ocorrências de viagem e posições GPS)
    e **comprovante de entrega** (canhoto da nota fiscal ou do CT-e).

    ## Fluxo de Autenticação
    1. Abra o endpoint `POST /login`, clique em **Try it out** e informe o usuário e a senha enviados para a sua transportadora.
    2. Ao clicar em **Execute**, o token retornado é aplicado automaticamente em todas as rotas desta página.
    3. Também é possível colar um token manualmente pelo botão **Authorize** no topo da página.
    4. Nas integrações, envie o token no header `Authorization: Bearer {token}`.

    ## Limites
    - No máximo **20 requisições a cada 5 segundos**. Acima disso a API responde `429` pedindo para aguardar.
    - No máximo **100 objetos** no array `geolocations` por requisição. Volumes maiores devem ser enviados em lotes.
    - Arquivos de comprovante: **PNG, JPG ou PDF de até 5MB**.

    ## Suporte
    E-mail: support@gerasinergia.zendesk.com · Telefone: 0800 721 0809
  version: 1.1.0

servers:
  - url: https://geolocation.iconic.webcol.systems
    description: Produção

security:
  - bearerAuth: []

tags:
  - name: Autenticação
    description: Obtenção do token de acesso
  - name: Geolocalização
    description: Envio de ocorrências de viagem e posições GPS
  - name: Comprovante de Entrega
    description: Envio do canhoto da nota fiscal ou do CT-e

paths:
  /login:
    post:
      operationId: login
      tags: [Autenticação]
      summary: Realiza login e retorna o token de acesso
      security: []
      servers:
        - url: https://base.iconic.webcol.systems
          description: Serviço Base - Produção
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "transportadora@seudominio.com.br"
                password:
                  type: string
                  format: password
                  example: "suasenha"
      responses:
        "200":
          description: Sucesso - Token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI..."
        "401":
          description: Credenciais inválidas

  /invoice-geolocations:
    post:
      operationId: enviarGeolocalizacoes
      tags: [Geolocalização]
      summary: Envia ocorrências de viagem e geolocalização
      description: |
        Envie as informações de geolocalização desde o início da viagem até a entrega,
        sempre com base na chave da nota fiscal eletrônica.

        - Frequência mínima de **30 minutos** durante a viagem.
        - Mudança de ocorrência deve ser enviada **no ato do evento**.
        - Até **100** itens por requisição.

        ### Ocorrências mínimas esperadas
        | Código | Descrição |
        |---|---|
        | 0 | Nota em trânsito |
        | 52 | Mercadoria no redespacho (finaliza a entrega do CT-e de primeiro trecho) |
        | 98 | Chegada no cliente - aguardando descarga |
        | 1 | Mercadoria entregue no cliente |
        | 25 | Mercadoria devolvida |
        | 6 | Endereço do cliente não localizado |
        | 21 | Estabelecimento fechado |
        | 104 | Troca de nota |
        | 105 | Entrega parcial |

        - **0**: no início da viagem, repetida a cada 30 minutos ou menos.
        - **98**: ao chegar no cliente; inicia a contagem do tempo de espera.
        - **1**: na entrega, com `data_entrega`; finaliza o tracking da nota.
        - **25**: na recusa pelo cliente, com `data_devolucao`; a data de entrega passa a ser a data da devolução.

        A resposta é sempre `200` quando o lote é processado. Itens recusados voltam em `errors`,
        cada um com o objeto enviado e o motivo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geolocations]
              properties:
                geolocations:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/Geolocation"
            examples:
              emTransito:
                summary: Ocorrência 0 - Nota em trânsito
                value:
                  geolocations:
                    - chave_nf: "35231226370747000397550010000700611173256116"
                      localizacao: "Rod. Presidente Dutra, km 150 - São José dos Campos/SP"
                      latitude: "-22.563854921505268"
                      longitude: "-44.16906843462949"
                      placa_veiculo: "GST1234"
                      cnpj_transportadora: "23429671000178"
                      previsao_entrega: "2026-10-21"
                      ocorrencia: 0
                      data_entrega: null
                      data_devolucao: null
                      data_geolocalizacao: "2026-10-19 11:53:00"
              redespacho:
                summary: Ocorrência 52 - Mercadoria no redespacho
                value:
                  geolocations:
                    - chave_nf: "35231226370747000397550010000700611173256116"
                      localizacao: "Terminal de redespacho - Curitiba/PR"
                      latitude: "-25.4284"
                      longitude: "-49.2733"
                      placa_veiculo: "GST1234"
                      cnpj_transportadora: "23429671000178"
                      ocorrencia: 52
                      data_entrega: null
                      data_devolucao: null
                      data_geolocalizacao: "2026-10-19 16:20:00"
              entregue:
                summary: Ocorrência 1 - Mercadoria entregue
                value:
                  geolocations:
                    - chave_nf: "35231226370747000397550010000700611173256116"
                      localizacao: "Cliente - Rua Exemplo, 100 - Campinas/SP"
                      latitude: "-22.9056"
                      longitude: "-47.0608"
                      placa_veiculo: "GST1234"
                      cnpj_transportadora: "23429671000178"
                      ocorrencia: 1
                      data_entrega: "2026-10-20 10:15:00"
                      data_devolucao: null
                      data_geolocalizacao: "2026-10-20 10:15:00"
              devolvida:
                summary: Ocorrência 25 - Mercadoria devolvida
                value:
                  geolocations:
                    - chave_nf: "35231226370747000397550010000700611173256116"
                      localizacao: "Cliente - Rua Exemplo, 100 - Campinas/SP"
                      latitude: "-22.9056"
                      longitude: "-47.0608"
                      placa_veiculo: "GST1234"
                      cnpj_transportadora: "23429671000178"
                      ocorrencia: 25
                      data_entrega: null
                      data_devolucao: "2026-10-20 10:40:00"
                      data_geolocalizacao: "2026-10-20 10:40:00"
      responses:
        "200":
          description: Lote processado. Itens aceitos em `success`, recusados em `errors`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeolocationResponse"
              examples:
                sucesso:
                  summary: Todos os itens aceitos
                  value:
                    success:
                      - id: 1234567
                        invoice_id: 213012
                        occurrence_type_id: 0
                        geolocation_date: "2026-10-19 11:53:00"
                    errors: []
                comErro:
                  summary: Item recusado
                  value:
                    success: []
                    errors:
                      - geolocation:
                          chave_nf: "35231226370747000397550010000700941110150508"
                          localizacao: "Rod. Presidente Dutra, km 150 - São José dos Campos/SP"
                          latitude: "-22.563854921505268"
                          longitude: "-44.16906843462949"
                          placa_veiculo: "GST1234"
                          cnpj_transportadora: "23429671000178"
                          previsao_entrega: "2026-10-21"
                          ocorrencia: 0
                          data_geolocalizacao: "2026-10-19 11:53:00"
                          data_entrega: null
                          data_devolucao: null
                        error: "Nota fiscal não encontrada."
        "400":
          description: Requisição inválida (lote ausente ou acima de 100 itens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                semLote:
                  value:
                    message: "'geolocations' não encontrada"
                    code: "E_EXCEPTION"
                limite:
                  value:
                    message: "Limite de 100 geolocalização exedido"
                    code: "E_EXCEPTION"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /upload-canhoto:
    post:
      operationId: enviarComprovanteNf
      tags: [Comprovante de Entrega]
      summary: Envia o comprovante de entrega da nota fiscal
      description: |
        Envie a imagem do **canhoto da NF-e (DANFE)**, datado e assinado. Não envie o comprovante do CT-e (DACTE) nesta rota.

        Informe a nota por `chave_nf` e envie o arquivo em `image` (multipart) **ou** a URL pública em `image_url` (JSON).
        Só é aceito um comprovante por nota: se já houver um aprovado ou em análise, o envio é recusado.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chave_nf, image]
              properties:
                chave_nf:
                  $ref: "#/components/schemas/ChaveNf"
                image:
                  type: string
                  format: binary
                  description: Arquivo PNG, JPG ou PDF de até 5MB.
          application/json:
            schema:
              type: object
              required: [chave_nf, image_url]
              properties:
                chave_nf:
                  $ref: "#/components/schemas/ChaveNf"
                image_url:
                  type: string
                  format: uri
                  description: URL pública do arquivo (PNG, JPG ou PDF de até 5MB).
            example:
              chave_nf: "35231226370747000397550010000700931110075290"
              image_url: "https://fastly.picsum.photos/id/492/1280/720.jpg"
      responses:
        "200":
          $ref: "#/components/responses/VoucherReceived"
        "400":
          description: Comprovante recusado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                arquivo:
                  value:
                    message: "Você deve enviar um arquivo do tipo png, jpg ou pdf, com no máximo 5MB"
                    code: "E_EXCEPTION"
                tamanho:
                  value:
                    message: "O tamanho do arquivo ultrapassa o limite de 5MB"
                    code: "E_EXCEPTION"
                tipo:
                  value:
                    message: "Arquivo inválido. Tente enviar arquivos do tipo: png, jpg ou pdf"
                    code: "E_EXCEPTION"
                outraTransportadora:
                  value:
                    message: "A Nota fiscal não pertence a sua transportadora"
                    code: "E_EXCEPTION"
                jaExiste:
                  value:
                    message: "Já existe um canhoto aprovado"
                    code: ""
        "401":
          $ref: "#/components/responses/Unauthorized"

  /upload-canhoto-cte:
    post:
      operationId: enviarComprovanteCte
      tags: [Comprovante de Entrega]
      summary: Envia o comprovante de entrega do CT-e
      description: |
        Informe o CT-e pela chave de acesso em `indent_key` (44 dígitos, com ou sem o prefixo `CTe`)
        e envie o arquivo em `image` (multipart) **ou** a URL pública em `image_url` (JSON).

        O documento esperado depende do trecho do CT-e:
        - **Último trecho** (entrega no destinatário): canhoto da **NF-e (DANFE)** de qualquer nota vinculada ao CT-e.
          O comprovante passa a valer para todas as notas do CT-e.
        - **Trechos intermediários** (redespacho): comprovante do **CT-e (DACTE)**, em que deve constar o número do CT-e.

        Só é aceito um comprovante por CT-e: se já houver um aprovado ou em análise, o envio é recusado.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [indent_key, image]
              properties:
                indent_key:
                  $ref: "#/components/schemas/ChaveCte"
                image:
                  type: string
                  format: binary
                  description: Arquivo PNG, JPG ou PDF de até 5MB.
          application/json:
            schema:
              type: object
              required: [indent_key, image_url]
              properties:
                indent_key:
                  $ref: "#/components/schemas/ChaveCte"
                image_url:
                  type: string
                  format: uri
                  description: URL pública do arquivo (PNG, JPG ou PDF de até 5MB).
            example:
              indent_key: "35261012345678000190570010000898351000898350"
              image_url: "https://fastly.picsum.photos/id/492/1280/720.jpg"
      responses:
        "200":
          $ref: "#/components/responses/VoucherReceived"
        "400":
          description: Comprovante recusado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                chave:
                  value:
                    message: "Chave do CT-e inválida"
                    code: "E_EXCEPTION"
                naoEncontrado:
                  value:
                    message: "CT-e não encontrado"
                    code: "E_EXCEPTION"
                outraTransportadora:
                  value:
                    message: "O CT-e não pertence a sua transportadora"
                    code: "E_EXCEPTION"
                semArquivo:
                  value:
                    message: "Envie image ou image_url (PNG, JPG ou PDF, até 5MB)"
                    code: "E_EXCEPTION"
                tipo:
                  value:
                    message: "Envie um arquivo PNG, JPG ou PDF"
                    code: "E_EXCEPTION"
                download:
                  value:
                    message: "Erro ao baixar a imagem, verifique a URL e o limite de 5MB"
                    code: "E_EXCEPTION"
                ilegivel:
                  value:
                    message: "Arquivo ilegível!"
                    code: "E_EXCEPTION"
                semNotas:
                  value:
                    message: "CT-e de último trecho não possui invoices vinculadas"
                    code: "E_EXCEPTION"
                jaExiste:
                  value:
                    message: "Já existe um canhoto em análise"
                    code: ""
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChaveNf:
      type: string
      pattern: "^\\d{44}$"
      description: Chave de acesso da NF-e (44 dígitos).
      example: "35231226370747000397550010000700611173256116"

    ChaveCte:
      type: string
      pattern: "^(CTe)?\\d{44}$"
      description: Chave de acesso do CT-e (44 dígitos), com ou sem o prefixo `CTe`.
      example: "35261012345678000190570010000898351000898350"

    Geolocation:
      type: object
      required: [chave_nf, placa_veiculo, cnpj_transportadora, ocorrencia, data_geolocalizacao]
      properties:
        chave_nf:
          $ref: "#/components/schemas/ChaveNf"
        localizacao:
          type: string
          description: Descrição da localização conforme fornecido pelo rastreador do veículo.
        latitude:
          type: string
          description: Latitude da localização enviada.
        longitude:
          type: string
          description: Longitude da localização enviada.
        placa_veiculo:
          type: string
          description: Placa do veículo.
        cnpj_transportadora:
          type: string
          description: CNPJ da transportadora (14 dígitos).
        previsao_entrega:
          type: string
          nullable: true
          description: Previsão de entrega (`AAAA-MM-DD` ou `AAAA-MM-DD HH:mm:ss`). Não pode ser anterior à emissão da NF.
        ocorrencia:
          type: integer
          description: Código da ocorrência de acordo com a tabela PROCEDA.
        data_entrega:
          type: string
          nullable: true
          description: Data e hora da entrega. Obrigatória apenas na ocorrência finalizadora 1.
        data_devolucao:
          type: string
          nullable: true
          description: Data e hora da devolução. Obrigatória apenas na ocorrência 25.
        data_geolocalizacao:
          type: string
          description: Data e hora da ocorrência (`AAAA-MM-DD HH:mm:ss`). Não pode ser futura nem anterior à emissão da NF.

    GeolocationResponse:
      type: object
      properties:
        success:
          type: array
          description: Geolocalizações registradas.
          items:
            type: object
        errors:
          type: array
          description: Itens recusados, com o objeto enviado e o motivo.
          items:
            type: object
            properties:
              geolocation:
                $ref: "#/components/schemas/Geolocation"
              error:
                type: string
                enum:
                  - "Nota fiscal não encontrada."
                  - "Data da geolocalização inválida."
                  - "Data da geolocalização anterior a data de emissão da NF."
                  - "Data da previsão de entrega inválida."
                  - "Data de entrega/devolução inválida."
                  - "Data de entrega/devolução anterior a data de chegada no cliente já registrada."
                  - "Está ocorrência não permite a inclusão do campo 'data_entrega'."
                  - "Transportadora não encontrada."
                  - "A Nota fiscal não pertence a sua transportadora."
                  - "Código de ocorrência inválido."
                  - "Placa do veículo não informada."
                  - "Nota fiscal já foi entregue."
                  - "Nota fiscal já foi devolvida."
                  - "A carga já chegou no cliente, essa ocorrência não pode ser cadastrada."
                  - "Este transportador não possui mais permissão para registrar ocorrências nesta nota."
                  - "Já existe uma data de entrega registrada para esta nota por este transportador."

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string

  responses:
    VoucherReceived:
      description: |
        Comprovante recebido. A mensagem indica o resultado da validação automática:
        aprovado, enviado para análise ou rejeitado (com o motivo).
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
          examples:
            aprovado:
              value:
                message: "Comprovante recebido com sucesso"
            analise:
              value:
                message: "Comprovante recebido para análise, motivo: Data de entrega não identificada"
            rejeitado:
              value:
                message: "Comprovante rejeitado, motivo: Imagem não corresponde ao documento"

    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          example:
            errors:
              - message: "E_UNAUTHORIZED_ACCESS: Unauthorized access"

    TooManyRequests:
      description: Limite de requisições atingido
      content:
        application/json:
          example:
            errors:
              - message: "Limite de request atigindo. Aguarde 5 segundos"
